<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
      .icon {
        width: 512px;
        height: 512px;
        border-radius: 108px;
        background: linear-gradient(165deg, #ffd4c4 0%, #ffb4a2 42%, #d7c4f8 100%);
        position: relative;
        overflow: hidden;
      }
      .key {
        position: absolute;
        top: 168px;
        width: 86px;
        height: 230px;
        background: #fff8f0;
        border-radius: 14px 14px 18px 18px;
        box-shadow: 0 10px 0 rgba(59, 51, 85, 0.12);
      }
      .k1 {
        left: 108px;
      }
      .k2 {
        left: 213px;
      }
      .k3 {
        left: 318px;
      }
      .black {
        position: absolute;
        top: 168px;
        width: 52px;
        height: 128px;
        background: #3b3355;
        border-radius: 0 0 8px 8px;
      }
      .b1 {
        left: 168px;
      }
      .b2 {
        left: 273px;
      }
      .star {
        position: absolute;
        right: 64px;
        top: 52px;
        font-size: 92px;
        color: #ffd15c;
        filter: drop-shadow(0 6px 0 #e0a020);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="key k1"></div>
      <div class="key k2"></div>
      <div class="key k3"></div>
      <div class="black b1"></div>
      <div class="black b2"></div>
      <div class="star">★</div>
    </div>
  </body>
</html>
